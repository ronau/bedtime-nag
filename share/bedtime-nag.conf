# bedtime-nag constants. The single source of truth: bin/bedtime-nag and
# lib/nag.js both parse this file (neither runs it as shell). One KEY=VALUE
# per line; the value is everything after the first '=', taken literally: no
# quotes, no escaping, no spaces around '='. Lines starting with '#' are
# comments.
#
# After editing, run `bedtime-nag install` to copy it over and re-render the
# LaunchAgent (INTERVAL ends up in the plist).

# Default nag window, local time, 24h. Used while the `start` / `end` settings
# are not set (see `bedtime-nag bedtime` / `wake`).
DEFAULT_START=22:30
DEFAULT_END=05:00

# Seconds between launchd runs. The overlay's "Snooze N min" label is derived
# from this, so the label cannot disagree with the real snooze length.
INTERVAL=300

# Seconds before the snooze button becomes clickable.
UNLOCK_AFTER=20
